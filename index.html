<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Style Website</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #343541;
    color: #ececf1;
    display: flex;
    height: 100vh;
}

/* Main Chat Section */
.chat-container {
    flex: 3;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 15px;
    background-color: #202123;
    font-weight: bold;
    font-size: 18px;
}

.chat-messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 8px;
    max-width: 70%;
}

.user {
    background-color: #444654;
    align-self: flex-end;
}

.bot {
    background-color: #3e3f4b;
    align-self: flex-start;
}

.chat-input {
    display: flex;
    padding: 15px;
    background-color: #202123;
}

.chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: none;
    outline: none;
}

.chat-input button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    background-color: #19c37d;
    color: white;
    cursor: pointer;
}

/* Right Sidebar */
.sidebar {
    flex: 1;
    background-color: #202123;
    padding: 20px;
    border-left: 1px solid #444;
    display: flex;
    flex-direction: column;
}

.sidebar h2 {
    margin-top: 0;
}

.comment-list {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 15px;
}

.comment {
    background-color: #444654;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14px;
}
